  </div>
  <div class="camo-wrap">
    <button class="camo-btn" id="camoBtn" title="Tab disguise (`)">
      <svg class="icon" aria-hidden="true"><use href="#icon-mask"/></svg>
    </button>
    <div class="camo-dropdown" id="camoDropdown"></div>
  </div>
  <button class="theme-btn" id="themeToggle" aria-label="Toggle theme">
    <svg class="icon" aria-hidden="true"><use href="#icon-sun"/></svg>
  </button>

    <svg class="icon" aria-hidden="true"><use href="#icon-menu"/></svg>
  </button>
</nav>

<main>
  <div class="container">

    <section class="hub-head">
      <h1 class="hub-title">Favorites</h1>
      <p class="hub-sub" id="favSub">Games you've hearted</p>
    </section>

    <!-- Sort bar (hidden until favs render) -->
    <div class="idx-filter-bar" id="favSortBar" style="display:none">
      <div class="idx-chips-wrap" style="text-align:left">
        <span class="idx-count" id="favCount" style="font-size:.82rem"></span>
      </div>
      <div class="idx-sort-group" aria-label="Sort favorites">
        <span class="idx-sort-label">Sort:</span>
        <button class="idx-sort-btn active" data-sort="recent">Recent</button>
        <button class="idx-sort-btn" data-sort="az">A–Z</button>
        <button class="idx-sort-btn" data-sort="played">Most Played</button>
      </div>
    </div>

    <div class="idx-grid" id="gamesGrid" aria-busy="true" aria-label="Favourite games"></div>

  </div>
</main>
