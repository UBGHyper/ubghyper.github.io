name: Game Request
description: Request a game to be added to UBGHyper
title: "[Game Request] "
labels: ["game-request"]
body:
  - type: input
    id: game-name
    attributes:
      label: Game name
      placeholder: e.g. Slope, Cookie Clicker, Geometry Dash
    validations:
      required: true

  - type: input
    id: game-url
    attributes:
      label: Where can the game be played?
      description: Link to the original game or a site where it works
      placeholder: https://...
    validations:
      required: false

  - type: textarea
    id: why
    attributes:
      label: Why should this game be added?
      description: Tell us why you love it or why players would enjoy it
      placeholder: It's a classic, very popular at school, great mechanics...
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Action
        - Adventure
        - Arcade
        - Fighting
        - Horror
        - Idle / Clicker
        - Multiplayer
        - Physics
        - Platformer
        - Puzzle
        - Racing
        - RPG
        - Sandbox
        - Shooter
        - Simulation
        - Sports
        - Strategy
        - Other
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I've searched existing issues to make sure this hasn't been requested already
        - label: The game works in a browser without needing to download anything
