name: Refresh game ratings

# Pulls live Firestore rating aggregates into assets/ratings.json and bakes
# AggregateRating into the game-page schema (only for games with 5+ real votes).
# Runs weekly so search-result stars stay current without manual work.

on:
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-ratings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Snapshot ratings + bake AggregateRating
        run: |
          node scripts/gen-ratings.js
          node scripts/gen-game-pages.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: refresh game rating snapshots [skip ci]"
            git push
            echo "Ratings refreshed and pushed."
          else
            echo "No rating changes."
          fi
